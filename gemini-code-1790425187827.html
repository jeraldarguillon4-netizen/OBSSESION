<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #050505;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Heart Button Container */
        .heart-container {
            position: relative;
            cursor: pointer;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .heart-container.hidden {
            opacity: 0;
            transform: scale(0);
            pointer-events: none;
        }

        /* SVG Heart Shape with Pulsing Animation */
        .beating-heart {
            width: 120px;
            height: 120px;
            fill: #ff1a75;
            filter: drop-shadow(0 0 15px #ff1a75) drop-shadow(0 0 30px #ff0055);
            animation: pulse 1.1s infinite ease-in-out;
        }

        @keyframes pulse {
            0% {
                transform: scale(0.95);
                filter: drop-shadow(0 0 10px #ff1a75) drop-shadow(0 0 20px #ff0055);
            }
            50% {
                transform: scale(1.15);
                filter: drop-shadow(0 0 25px #ff1a75) drop-shadow(0 0 50px #ff0055);
            }
            100% {
                transform: scale(0.95);
                filter: drop-shadow(0 0 10px #ff1a75) drop-shadow(0 0 20px #ff0055);
            }
        }

        /* Main Display Canvas */
        #heart-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* Individual Text Styling */
        .love-text {
            position: absolute;
            color: #ff4d88;
            font-weight: 700;
            font-size: 13px;
            text-shadow: 0 0 8px #ff0055, 0 0 15px #ff1a75;
            transform: translate(-50%, -50%);
            white-space: nowrap;
            opacity: 0;
            animation: fadeIn 0.4s forwards ease-out;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }
    </style>
</head>
<body>

    <!-- Pulsing Heart Button -->
    <div class="heart-container" id="heart-btn">
        <svg class="beating-heart" viewBox="0 0 32 32">
            <path d="M16 28.5 C12 24.5 4 17 4 10.5 C4 6.5 7 3.5 11 3.5 C13.5 3.5 15.5 4.8 16 6 C16.5 4.8 18.5 3.5 21 3.5 C25 3.5 28 6.5 28 10.5 C28 17 20 24.5 16 28.5 Z"/>
        </svg>
    </div>

    <!-- Canvas area for the text shape -->
    <div id="heart-canvas"></div>

    <script>
        const heartBtn = document.getElementById('heart-btn');
        const canvas = document.getElementById('heart-canvas');

        heartBtn.addEventListener('click', () => {
            // Hide the center button
            heartBtn.classList.add('hidden');

            const cx = window.innerWidth / 2;
            const cy = window.innerHeight / 2;
            const points = [];

            // Calculate heart shape coordinates using parametric equations
            const totalSteps = 60;
            for (let i = 0; i < totalSteps; i++) {
                const angle = (i / totalSteps) * (Math.PI * 2);
                
                // Parametric formulas for heart path
                const x = 16 * Math.pow(Math.sin(angle), 3);
                const y = -(13 * Math.cos(angle) - 5 * Math.cos(2 * angle) - 2 * Math.cos(3 * angle) - Math.cos(4 * angle));

                // Scale relative to viewport dimensions
                const scale = Math.min(window.innerWidth, window.innerHeight) / 38;

                points.push({
                    x: cx + x * scale,
                    y: cy + y * scale
                });
            }

            // Animate each text block into position sequentially
            points.forEach((pt, index) => {
                setTimeout(() => {
                    const textNode = document.createElement('div');
                    textNode.className = 'love-text';
                    textNode.innerText = 'I Love You';
                    textNode.style.left = `${pt.x}px`;
                    textNode.style.top = `${pt.y}px`;
                    canvas.appendChild(textNode);
                }, index * 35);
            });
        });
    </script>
</body>
</html>
